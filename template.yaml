AWSTemplateFormatVersion: '2010-09-09'
Description: TA-2 - Event-driven serverless file processing (S3 -> Lambda in private subnet -> SNS)

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address that will receive the SNS alerts
    AllowedPattern: '[^@\s]+@[^@\s]+\.[^@\s]+'
    ConstraintDescription: Must be a valid email address

Resources:

  # ==========================================================
  # STEP 2: NETWORKING
  # ==========================================================

  # --- VPC (our private network inside AWS) ---
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: TA2-VPC

  # --- Internet Gateway (the VPC's door to the internet) ---
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: TA2-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # --- Public Subnet (hosts the NAT Gateway) ---
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: TA2-Public-Subnet

  # --- Private Subnet (hosts the Lambda function) ---
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: TA2-Private-Subnet

  # --- NAT Gateway (lets private resources reach the internet, one-way) ---
  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: TA2-NAT-EIP

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: TA2-NAT-Gateway

  # --- Public Route Table: internet traffic goes to the IGW ---
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: TA2-Public-RT

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # --- Private Route Table: internet traffic goes to the NAT Gateway ---
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: TA2-Private-RT

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # --- S3 Gateway VPC Endpoint (private path to S3, no internet needed) ---
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # ==========================================================
  # STEP 3: STORAGE (S3), MESSAGING (SNS), IAM ROLE
  # ==========================================================

  # --- S3 Bucket: encrypted (SSE-S3) and fully private ---
  # The notification that triggers Lambda is added in Step 4.
  FileBucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaInvokePermission
    Properties:
      BucketName: !Sub ta2-file-processing-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Trigger Lambda only for new files under uploads/ (prevents an infinite loop)
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ProcessingFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  # --- SNS Topic + Email Subscription ---
  FileProcessingTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: FileProcessingAlerts

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref FileProcessingTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # --- IAM Execution Role for the Lambda ---
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TA2-Lambda-Role-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: TA2-S3-SNS-Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3ReadWrite
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::ta2-file-processing-${AWS::AccountId}-${AWS::Region}/*
              - Sid: SnsPublish
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref FileProcessingTopic

  # ==========================================================
  # STEP 4: LAMBDA FUNCTION + PERMISSION
  # ==========================================================

  # --- Security Group for the Lambda (allows outbound traffic only) ---
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the TA2 processing Lambda
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: TA2-Lambda-SG

  # --- The Lambda function, deployed in the PRIVATE subnet ---
  ProcessingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TA2-FileProcessor
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref FileProcessingTopic
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Code:
        ZipFile: |
          import json
          import os
          import urllib.parse
          from datetime import datetime, timezone

          import boto3

          s3 = boto3.client("s3")
          sns = boto3.client("sns")


          def lambda_handler(event, context):
              topic_arn = os.environ["SNS_TOPIC_ARN"]

              # An S3 event can contain more than one record, so we loop over them
              for record in event["Records"]:
                  bucket = record["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])

                  # Read the details (metadata) of the uploaded file
                  info = s3.head_object(Bucket=bucket, Key=key)
                  size = info["ContentLength"]
                  content_type = info.get("ContentType", "unknown")

                  # Build the processed metadata log
                  log = {
                      "bucket": bucket,
                      "key": key,
                      "size_bytes": size,
                      "content_type": content_type,
                      "processed_at": datetime.now(timezone.utc).isoformat(),
                  }

                  # Write the log back to S3 under processed/ (NOT uploads/, to avoid a loop)
                  log_key = "processed/" + key.split("/")[-1] + ".json"
                  s3.put_object(
                      Bucket=bucket,
                      Key=log_key,
                      Body=json.dumps(log, indent=2),
                      ContentType="application/json",
                  )

                  # Send the summary to the SNS topic (this becomes the email)
                  message = (
                      "File processed successfully!\n\n"
                      "Bucket: " + bucket + "\n"
                      "File: " + key + "\n"
                      "Size: " + str(size) + " bytes\n"
                      "Type: " + content_type + "\n"
                      "Log written to: " + log_key
                  )
                  sns.publish(
                      TopicArn=topic_arn,
                      Subject="TA2: File processed - " + key.split("/")[-1],
                      Message=message,
                  )

              return {"statusCode": 200, "body": "Done"}

  # --- Resource-based policy: lets S3 invoke the Lambda ---
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProcessingFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:aws:s3:::ta2-file-processing-${AWS::AccountId}-${AWS::Region}

Outputs:
  BucketName:
    Description: Upload test files into the uploads/ folder of this bucket
    Value: !Ref FileBucket
  SNSTopicArn:
    Description: SNS topic that sends the email alerts
    Value: !Ref FileProcessingTopic
  LambdaFunctionName:
    Description: Processing Lambda function
    Value: !Ref ProcessingFunction
